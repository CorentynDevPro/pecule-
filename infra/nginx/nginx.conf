# Sert la PWA et relaie l'API. Le HTTPS est assuré en amont par `tailscale serve`.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Le service worker et le manifest ne doivent jamais rester en cache navigateur,
  # sinon les mises à jour de l'application n'arrivent pas sur les appareils.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Fichiers compilés : nom avec empreinte, cache long.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # WebSocket des cours en direct.
  location /api/live {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 5m;
  }

  # Application monopage : toute autre route renvoie index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
